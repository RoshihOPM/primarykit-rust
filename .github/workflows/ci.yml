name: Rust CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Generate and validate an independent Axum service
        shell: bash
        run: |
          cargo run -p primarykit -- new smoke_api --output "$RUNNER_TEMP"
          cargo run -p primarykit -- modules
          cargo run -p primarykit -- add pagination --project "$RUNNER_TEMP/smoke_api"
          test -f "$RUNNER_TEMP/smoke_api/src/modules/api_errors.rs"
          test -f "$RUNNER_TEMP/smoke_api/src/modules/pagination.rs"
          cd "$RUNNER_TEMP/smoke_api"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release

  postgres-template:
    name: Generate, migrate and test PostgreSQL template
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: primarykit
          POSTGRES_PASSWORD: primarykit_dev_only
          POSTGRES_DB: primarykit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primarykit -d primarykit_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://primarykit:primarykit_dev_only@127.0.0.1:5432/primarykit_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Create and test an independent PostgreSQL application
        shell: bash
        run: |
          cargo run -p primarykit -- new db_api --template postgres --output "$RUNNER_TEMP"
          cargo run -p primarykit -- add audit --project "$RUNNER_TEMP/db_api"
          cargo run -p primarykit -- add permissions --project "$RUNNER_TEMP/db_api"
          cargo run -p primarykit -- add api_keys --project "$RUNNER_TEMP/db_api"
          test -f "$RUNNER_TEMP/db_api/src/modules/api_keys.rs"
          test -f "$RUNNER_TEMP/db_api/migrations/20261104000008_create_api_keys.sql"
          cargo run -p primarykit -- add auth_http --project "$RUNNER_TEMP/db_api"
          cargo run -p primarykit -- add auth_smtp --project "$RUNNER_TEMP/db_api"
          test -f "$RUNNER_TEMP/db_api/src/modules/auth_smtp.rs"
          cargo run -p primarykit -- add owned_records --project "$RUNNER_TEMP/db_api"
          test -f "$RUNNER_TEMP/db_api/src/modules/owned_records.rs"
          test -f "$RUNNER_TEMP/db_api/migrations/20261104000005_create_owned_records.sql"
          test -f "$RUNNER_TEMP/db_api/src/modules/auth_http.rs"
          test -f "$RUNNER_TEMP/db_api/src/modules/identity_outbox.rs"
          test -f "$RUNNER_TEMP/db_api/migrations/20261104000006_create_identity_outbox.sql"
          test -f "$RUNNER_TEMP/db_api/migrations/20261104000007_outbox_key_version.sql"
          test -f "$RUNNER_TEMP/db_api/migrations/20261104000004_create_identity_http.sql"
          test -f "$RUNNER_TEMP/db_api/src/modules/auth.rs"
          test -f "$RUNNER_TEMP/db_api/src/modules/permissions.rs"
          test -f "$RUNNER_TEMP/db_api/migrations/20261103000002_create_auth.sql"
          test -f "$RUNNER_TEMP/db_api/migrations/20261103000003_create_rbac.sql"
          test -f "$RUNNER_TEMP/db_api/migrations/20261103000001_create_audit_events.sql"
          cd "$RUNNER_TEMP/db_api"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release
