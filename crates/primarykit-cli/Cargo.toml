[package]
name = "primarykit"
version = "0.1.0"
edition = "2021"
description = "Copy-based generator for independent Rust/Axum services"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "primarykit"
path = "src/main.rs"

[lib]
name = "primarykit"
path = "src/lib.rs"
